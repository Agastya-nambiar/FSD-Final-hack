services:
  - type: web
    name: sentinel-ir
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: sentinel-evidence
      mountPath: /opt/render/project/src/data/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DB_NAME
        value: sentinel_ir
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: SYSTEM_ADMIN_EMAIL
        sync: false
      - key: SYSTEM_ADMIN_PASSWORD
        sync: false
      - key: ANALYST_EMAIL
        sync: false
      - key: ANALYST_PASSWORD
        sync: false
      - key: EMPLOYEE_EMAIL
        sync: false
      - key: EMPLOYEE_PASSWORD
        sync: false
      - key: MAX_UPLOAD_MB
        value: "10"
